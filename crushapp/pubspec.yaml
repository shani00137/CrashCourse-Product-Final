name: crushapp
version: 1.0.0+20
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=2.17.0 <3.0.0'

dependencies: 
  cupertino_icons: ^1.0.2
  get: 4.6.5
  get_storage: ^2.0.3
  lottie: ^1.3.0
  fluttertoast: ^8.0.9
  platform_device_id: ^1.0.1
  http: ^0.13.4
  intl: ^0.17.0
  dio: ^4.0.0
  flutter_html: ^3.0.0-alpha.6
  flutter_secure_storage: ^4.2.1
  flutter_countdown_timer: ^4.1.0
  flutter_windowmanager: ^0.2.0
  firebase_messaging: ^11.4.1
  percent_indicator: ^4.2.2
  file_support: ^1.0.6
  badges: ^2.0.3
  google_fonts: ^3.0.1
  image_picker: ^0.8.5+3
  hexcolor: ^2.0.5
  flutter_local_notifications: ^9.6.1
  firebase_analytics: ^9.1.9
  chat_bubbles: ^1.2.0
  scrollable_positioned_list: ^0.3.2
  rename: ^2.0.1
  webview_flutter: ^2.6.0
  video_player: ^2.8.2
  flutter_cached_pdfview: ^0.4.1
  advance_pdf_viewer_fork: ^2.0.0
  flutter_udid: ^2.0.0
  easy_pdf_viewer: ^1.0.7
  camera: ^0.10.0+1
  flutter: 
    sdk: flutter

dev_dependencies: 
  flutter_lints: ^2.0.0
  flutter_test: 
    sdk: flutter

  flutter_native_splash: ^2.1.6

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash.png

flutter: 
  uses-material-design: true

  assets:
    - assets/splash.png
    - assets/uploaddocument.png
    - assets/chat.json
    - assets/reading.json
    - assets/result.json
    - assets/setting.json
    - assets/quiz.json

