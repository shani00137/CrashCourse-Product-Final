<ngx-spinner
  bdColor="rgba(51,51,51,0.8)"
  size="medium"
  color="#fff"
  type="ball-scale-multiple"
>
  <p style="font-size: 20px; color: white">Loading...</p>
</ngx-spinner>
<div class="row">
    <div class="col-md-12">
    
<div class="card">
    <div class="card-body">
      <div class="row">
        <div class="col-sm-5">
          <h4 class="card-title mb-0">User Role</h4>
          <div class="small text-muted">Manage Users Role</div>
        </div><!--/.col-->
        <div class="col-sm-7 d-none d-md-block">
          <button type="button" data-toggle="modal" (click)="create()" (click)="myModal.show()" class="btn btn-primary float-right"><i class="fa fa-plus-circle"></i></button>
          
        </div><!--/.col-->
        <table class="table table-responsive-sm table-hover table-outline mb-0">
                <thead class="thead-light">
                  <tr>
                    <th class="text-center"><i class="icon-key"></i></th>
                    <th>Role Name</th>
                    <th class="text-center">Action</th>
                 
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let val of roledetail">
                    <td class="text-center">
                        <div>{{val.RoleId}}</div>
                    </td>
                    <td>
                        <div>{{val.RoleName}}</div>
                     
                    </td>
                    <td class="text-center">
                   
                     
                        <button (click)="Edit(val)"  data-toggle="modal" (click)="myModal.show()" class="btn btn-square btn-warning" type="button"> <i class="fa fa-pencil-square-o"></i></button>
                    </td>
                   
                  
                   
                  </tr>
                
                </tbody>
              </table>
 
      </div><!--/.row-->
      
    </div>
    <div class="card-footer">
      
    </div>
  </div>
  </div>
</div>
  <div bsModal #myModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title"> User Roles</h4>
          <button type="button" class="close" (click)="myModal.hide()" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
            <form [formGroup]="itemForm" (ngSubmit)="save()" >
                 
                <div class="form-group">
                    
                      <input type="hidden"  class="form-control"   [(ngModel)]="accountInfo.RoleId" formControlName="RoleId">
                      <div *ngIf="itemForm.controls['RoleId'].invalid && (itemForm.controls['RoleId'].dirty || itemForm.controls['RoleId'].touched)" class="danger" >
                              <span *ngIf="itemForm.controls['RoleId'].errors.required">
                                  <span style="color: red;">Please Enter  Role Name.</span>  
                              </span>
                          </div>
                    
                  </div>
                <div class="form-group">
                    <label >Role Name:</label>
                      <input placeholder="Role Name" class="form-control"   [(ngModel)]="accountInfo.RoleName" formControlName="RoleName">
                      <div *ngIf="itemForm.controls['RoleName'].invalid && (itemForm.controls['RoleName'].dirty || itemForm.controls['RoleName'].touched)" class="danger" >
                              <span *ngIf="itemForm.controls['RoleName'].errors.required">
                                  <span style="color: red;">Please Enter  Role Name.</span>  
                              </span>
                              <span *ngIf="itemForm.controls['DeducationName'].errors.minlength">
                                <span style="color: red;"> Name should minimum 3 words. .</span>  
                            </span>
                          </div>
                    
                  </div>
              
              <br>
              <div class="modal-footer">
                  <button type="submit"[disabled]="!itemForm.valid"  class="btn btn-sm btn-primary" type="submit">
                      <i class="fa fa-dot-circle-o"></i> Submit</button>
                   
             
              </div>
            </form>
        </div>
       
      </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
  </div><!-- /.modal -->
