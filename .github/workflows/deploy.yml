name: Deploy to SmarterASP

on:
  push:
    branches:
      - invoice
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment(s) to deploy
        type: choice
        required: true
        default: development
        options:
          - development
          - production
          - both

jobs:
  deploy-development:
    name: Deploy to Development
    if: ${{ (github.event_name == 'push' && github.ref_name == 'invoice') || (github.event_name == 'workflow_dispatch' && (inputs.environment == 'development' || inputs.environment == 'both')) }}
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: development
      api_url: https://development.crashcourseonlin.net
    secrets:
      ftp_server: ${{ secrets.FTP_SERVER }}
      ftp_username: ${{ secrets.FTP_USERNAME }}
      ftp_password: ${{ secrets.FTP_PASSWORD }}
      ftp_server_dir: ${{ secrets.FTP_SERVER_DIR }}
      db_connection_string: ${{ secrets.DB_CONNECTION_STRING }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      smtp_password: ${{ secrets.SMTP_PASSWORD }}
      r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      r2_bucket_name: ${{ secrets.R2_BUCKET_NAME }}
      r2_public_url: ${{ secrets.R2_PUBLIC_URL }}

  deploy-production:
    name: Deploy to Production
    if: ${{ (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && (inputs.environment == 'production' || inputs.environment == 'both')) }}
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      api_url: https://crashcourseonlin.net
    secrets:
      ftp_server: ${{ secrets.FTP_SERVER_PRODUCTION }}
      ftp_username: ${{ secrets.FTP_USERNAME_PRODUCTION }}
      ftp_password: ${{ secrets.FTP_PASSWORD_PRODUCTION }}
      ftp_server_dir: ${{ secrets.FTP_SERVER_DIR_PRODUCTION }}
      db_connection_string: ${{ secrets.DB_CONNECTION_STRING_PRODUCTION }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY_PRODUCTION }}
      stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY_PRODUCTION }}
      stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY_PRODUCTION }}
      stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET_PRODUCTION }}
      smtp_password: ${{ secrets.SMTP_PASSWORD_PRODUCTION }}
      r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      r2_bucket_name: ${{ secrets.R2_BUCKET_NAME }}
      r2_public_url: ${{ secrets.R2_PUBLIC_URL }}
